@if (showPrompt()) {
  <div class="install-banner">
    <div class="install-content">
      @if (isIOS()) {
        <div class="install-message">
          <strong>Installér Pukka-kalenderen som app!</strong>
          <p>
            Tryk på
            <svg class="share-icon" viewBox="0 0 24 24" fill="currentColor">
              <path
                d="M16 5l-1.42 1.42-1.59-1.59V16h-1.98V4.83L9.42 6.42 8 5l4-4 4 4zm4 5v11c0 1.1-.9 2-2 2H6c-1.1 0-2-.9-2-2V10c0-1.1.9-2 2-2h3v2H6v11h12V10h-3V8h3c1.1 0 2 .9 2 2z"
              />
            </svg>
            derefter "Føj til hjemmeskærm"
          </p>
        </div>
      } @else {
        <div class="install-message">
          <strong>Installér Pukka-kalenderen som app!</strong>
          <p>Nyd din te med hurtigere adgang og offline brug 🥳</p>
        </div>
        <button class="install-button" (click)="install()">Installér</button>
      }
      <button class="close-button" (click)="dismiss()" aria-label="Close">×</button>
    </div>
  </div>
}
